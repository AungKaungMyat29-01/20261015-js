<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>スライドショー（フェードイン／アウト）カスタム</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery本体 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div id="wrapper">
        <header>
            <h1>Slideshow Fade</h1>
        </header>

        <div id="slide">
            <ul>
                <li>
                    <img src="img/bulldog.jpeg" alt="img1">
                </li>
                <li>
                    <img src="img/german shepherd.jpeg" alt="img2">
                </li>
                <li>
                    <img src="img/golden retriever.jpeg" alt="img3">
                </li>
                <li>
                    <img src="img/husky.jpeg" alt="img4">
                </li>
            </ul>
        </div>

        <div id="button">
            <ul>
                <li><a href="#" class="target">1</a></li>
                <li><a href="#">2</a></li>
                <li><a href="#">3</a></li>
                <li><a href="#">4</a></li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
